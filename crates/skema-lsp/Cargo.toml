[package]
name = "skema-lsp"
description = "Language server for skema (stdio, LSP)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[[bin]]
name = "skema-lsp"
path = "src/main.rs"

[dependencies]
skema-syntax.workspace = true
skema-loader.workspace = true
# Without the `typescript` feature: the wasm ABI is not something a native
# binary can or should carry. The types are the same either way.
skema-api.workspace = true

lsp-server = "0.7"
lsp-types = "=0.94.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
tempfile = "3"

[lints]
workspace = true
