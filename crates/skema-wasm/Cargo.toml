[package]
name = "skema-wasm"
description = "WASM bindings for skema: browser-facing check/export API"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
# `typescript` is what makes the shared DTOs emit their TypeScript
# declarations and their wasm ABI; without it this crate could not return
# them across the boundary at all.
skema-api = { workspace = true, features = ["typescript"] }

wasm-bindgen = "0.2"
console_error_panic_hook = "0.1"

[dev-dependencies]
wasm-bindgen-test = "0.3"

[lints]
workspace = true
