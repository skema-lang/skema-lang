[package]
name = "skema-cli"
description = "Command-line tool for skema: check, export"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[[bin]]
name = "skema"
path = "src/main.rs"

[dependencies]
# Only these two: the model and the diagnostics `skema-loader` returns are
# `skema-api`'s types, and nothing here reaches past them into the core.
skema-api.workspace = true
skema-loader.workspace = true
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
tempfile = "3"

[lints]
workspace = true
