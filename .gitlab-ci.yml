spec:
  inputs:
    trigger_downstream:
      type: boolean
      default: true
      description: "Whether to trigger skema-lib after releasing"
    republish_version:
      type: string
      default: ""
      regex: '^(v\d+\.\d+\.\d+(-rc\.\d+)?)?$'
      description: "Existing vX.Y.Z(-rc.N) to re-run publish steps for"

---

## skema — GitLab CI/CD
##
## Every job runs through the project's own devenv.nix instead of a
## hand-rolled image + apt-get/rustup/pip setup — the same toolchain
## `devenv test` runs locally as `check`.
##
## Prerequisites in the GitLab project settings:
##   - Container Registry enabled (for the `docker-build` job).
##   - Settings → CI/CD → Job token permissions → **Allow Git push requests to
##     the repository**. Off by default; GA in GitLab 18.4. Lets the
##     skema-ci `release` job push the version bump, tag and GitLab Release
##     with nothing but `CI_JOB_TOKEN`.
##   - skema-lib must allow this project to trigger it: Settings → CI/CD →
##     Job token permissions → add `skema-language/skema` to its allowlist.

include:
  - component: $CI_SERVER_FQDN/skema-language/skema-ci/release@0.1.8
    inputs:
      version_file_kind: cargo
      version_file_paths: "Cargo.toml Cargo.lock"
      generic_package_name: skema
      asset_globs: "target/release/skema target/release/skema-lsp dist/skema-lsp-* dist/*.whl dist/skema-wasm.tar.gz"
      dependants: "skema-language/skema-lib"
      handoff_input_name: skema_lang_version
      version_stage: version
      release_stage: release
      handoff_stage: handoff
      adopt_stage: check
      trigger_downstream: $[[ inputs.trigger_downstream ]]
      republish_version: $[[ inputs.republish_version ]]

workflow:
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == "development"
    - if: $CI_COMMIT_BRANCH == "main"

stages:
  - check
  - version
  - build
  - release
  - package
  - pages
  - handoff

variables:
  CARGO_HOME: ${CI_PROJECT_DIR}/.cargo-home
  NIX_CONFIG: |
    experimental-features = nix-command flakes
    sandbox = false

# Root-mode install (`--init none`) - GitLab job containers run as root, and
# Nix's single-user installer refuses that. `sandbox = false` (NIX_CONFIG
# above) because those containers also can't create the user namespaces
# Nix's build sandbox needs - moot today since every package resolves from a
# binary cache, kept defensively.
#
# devenv itself comes from devenv.lock's **`devenv`** node, not
# `nodes.nixpkgs` - the latter pins the package *set*, not the devenv
# program the lock's own modules are evaluated against.
.devenv_setup: &devenv_setup
  - apt-get update -qq
  - apt-get install -y --no-install-recommends curl xz-utils ca-certificates git >/dev/null
  - curl --proto '=https' --tlsv1.2 -sSf -L https://install.determinate.systems/nix -o /tmp/install-nix.sh
  - sh /tmp/install-nix.sh install linux --init none --no-confirm
  - . /nix/var/nix/profiles/default/etc/profile.d/nix-daemon.sh
  - |
    DEVENV_PIN=$(nix eval --impure --raw --expr \
      'let n = (builtins.fromJSON (builtins.readFile ./devenv.lock)).nodes.devenv.locked;
       in "${n.owner}/${n.repo}/${n.rev}"')
    echo "devenv from github:$DEVENV_PIN"
    # `--accept-flake-config` for devenv's own binary cache; without it this
    # compiles the whole Rust CLI from source on every job.
    nix profile install --accept-flake-config "github:$DEVENV_PIN"
    devenv version

.rust_cache: &rust_cache
  - key:
      files:
        - Cargo.lock
    paths:
      - .cargo-home/registry/index
      - .cargo-home/registry/cache
  - key: "target-$CI_JOB_NAME"
    paths:
      - target/

default:
  image: debian:bookworm-slim
  before_script: *devenv_setup

# --------------------------------------------------------------------------
# check
# --------------------------------------------------------------------------

# fmt + clippy (-D warnings) + test --workspace, defined once in devenv.nix
# (`enterTest`) and reused here verbatim.
check:
  stage: check
  cache: *rust_cache
  script:
    - devenv test

# Advisory only: dependency vulnerabilities shouldn't block every push, but
# should be visible. Flip `allow_failure` to false once the crate graph has
# been swept once and the team wants this to gate merges.
audit:
  stage: check
  allow_failure: true
  script:
    - devenv shell -- cargo audit

coverage:
  stage: check
  cache: *rust_cache
  script:
    - devenv shell -- cargo llvm-cov --workspace --cobertura --output-path cobertura.xml
    - devenv shell -- cargo llvm-cov report --summary-only
  coverage: '/^TOTAL.*\s(\d+\.\d+)%/'
  artifacts:
    reports:
      coverage_report:
        coverage_format: cobertura
        path: cobertura.xml

# --------------------------------------------------------------------------
# build
# --------------------------------------------------------------------------
#
# All four jobs pick up `version`'s patched Cargo.toml/Cargo.lock, so a
# release build embeds the version it is about to be published under. On an
# MR there is no `version` job (component rule: main/development only), so
# `build`/`build-python-wheel` need it only optionally and always run as a
# plain check; on a branch pipeline with nothing releasable (empty
# `RELEASE_VERSION`) all four skip their real work instead of spending
# minutes on artifacts nothing will publish.
#
# Every job in this stage realises its own container-local Nix store of
# several GB (Nix is installed fresh per job), and the self-hosted runner ran
# out of disk when five of them did it at once - pipelines 58-60, "No space
# left on device" and a full /nix/var/nix/db/db.sqlite. One shared
# resource_group makes GitLab run them one at a time, so peak disk is one
# store rather than five. `check` succeeding on its own is the evidence that
# a single store does fit.
#
# This is a stopgap for runner capacity, not a fix for it: it trades a
# parallel build stage (~8 min) for a serial one (~35 min). Delete the
# resource_group from these four jobs once the runner has headroom - more
# disk, a lower `concurrent`, or a persistent /nix volume so the toolchain is
# realised once instead of per job.

# skema-py is excluded on purpose: it's not a standalone binary, and its
# proper build path (correct ABI tag, wheel packaging) is maturin, handled by
# build-python-wheel below.
build:
  stage: build
  resource_group: nix-store
  cache: *rust_cache
  needs:
    - job: version
      artifacts: true
      optional: true
  script:
    - '[ "$CI_PIPELINE_SOURCE" = "merge_request_event" ] || [ -n "$RELEASE_VERSION" ] || { echo "build: nothing to release, skipping."; exit 0; }'
    - devenv shell -- cargo build --release --workspace --exclude skema-py
  artifacts:
    paths:
      - target/release/skema
      - target/release/skema-lsp
    expire_in: 1 week

# The language server, per platform, for the VSCode extension to bundle.
# Cross-compiled via devenv.nix's `cross` profile: musl-static for linux (one
# binary regardless of glibc version), the GNU ABI for windows (what
# cross-compiles from Linux). No macOS runner exists yet - those users fall
# back to `skema.serverPath` with a locally built server.
build-release-binaries:
  stage: build
  resource_group: nix-store
  cache: *rust_cache
  needs:
    - job: version
      artifacts: true
  rules:
    - if: '$CI_COMMIT_BRANCH == "main" || $CI_COMMIT_BRANCH == "development"'
  parallel:
    matrix:
      # One profile per target: each job realises only its own platform's
      # cross toolchain - see devenv.nix, "cross - the release toolchain".
      - TARGET: x86_64-unknown-linux-musl
        PROFILE: cross-musl
      - TARGET: x86_64-pc-windows-gnu
        PROFILE: cross-windows
  script:
    - '[ -n "$RELEASE_VERSION" ] || { echo "build-release-binaries: nothing to release, skipping."; exit 0; }'
    - devenv --profile "$PROFILE" shell -- cargo build --release -p skema-lsp --target "$TARGET"
    - mkdir -p dist
    # Named by target triple: the extension's fetch script asks for exactly
    # this name, and one unqualified `skema-lsp` per tag could only ever be
    # one platform's.
    - |
      if [ "$TARGET" = "x86_64-pc-windows-gnu" ]; then
        cp "target/$TARGET/release/skema-lsp.exe" "dist/skema-lsp-$TARGET.exe"
      else
        cp "target/$TARGET/release/skema-lsp" "dist/skema-lsp-$TARGET"
      fi
  artifacts:
    paths:
      - dist/skema-lsp-*
    expire_in: 1 week

build-python-wheel:
  stage: build
  resource_group: nix-store
  cache: *rust_cache
  needs:
    - job: version
      artifacts: true
      optional: true
  script:
    - '[ "$CI_PIPELINE_SOURCE" = "merge_request_event" ] || [ -n "$RELEASE_VERSION" ] || { echo "build-python-wheel: nothing to release, skipping."; exit 0; }'
    - devenv shell -- maturin build --release --manifest-path crates/skema-py/Cargo.toml --out dist
    - devenv shell -- python3 -m venv .venv
    - |
      . .venv/bin/activate
      pip install dist/*.whl
      python3 - <<'PYEOF'
      import json
      import skema
      print(json.dumps(skema.check("examples/myexample.skema"))[:200])
      model = skema.export("crates/skema-cli/tests/fixtures/export-contract/project.skema")["model"]
      customer = next(t for t in model["tables"] if t["name"] == "Customer")
      assert customer["extensions"] == {"x-nocobase-title": "Customers"}, customer["extensions"]
      money = next(d for d in model["datatypes"] if d["name"] == "Money")
      assert (money["namespace"], money["baseType"], money["resolvedBaseType"]) == ("shared", "decimal", "float"), money
      balance = next(f for f in customer["fields"] if f["name"] == "balance")
      assert balance["ty"]["datatype"] == {"namespace": "shared", "name": "Money"}, balance["ty"]
      status = next(e for e in model["enums"] if e["name"] == "Status")
      assert (status["default"], status["note"]) == ("active", "Stored as text"), status
      PYEOF
  artifacts:
    paths:
      - dist/*.whl
    expire_in: 1 week

# The browser build: wasm-bindgen's raw output, tarred up as a build
# artifact for skema-lib's `wasm-packaging/` to turn into `@skema/model`/
# `@skema/wasm` (CLAUDE.md, "The generated boundary") - not done here, this
# repo stays Rust-only. Also the rollback path if `@skema/wasm` itself ever
# needs to be: skemaeditor used to vendor these four files directly.
build-wasm-package:
  stage: build
  resource_group: nix-store
  cache: *rust_cache
  needs:
    - job: version
      artifacts: true
  rules:
    - if: '$CI_COMMIT_BRANCH == "main" || $CI_COMMIT_BRANCH == "development"'
  script:
    - '[ -n "$RELEASE_VERSION" ] || { echo "build-wasm-package: nothing to release, skipping."; exit 0; }'
    - devenv shell -- bash -c "cd crates/skema-wasm && wasm-pack build --target web --release"
    - mkdir -p dist
    - |
      tar czf dist/skema-wasm.tar.gz -C crates/skema-wasm/pkg \
        skema_wasm.js skema_wasm.d.ts skema_wasm_bg.wasm skema_wasm_bg.wasm.d.ts
  artifacts:
    paths:
      - dist/skema-wasm.tar.gz
    expire_in: 1 week

# --------------------------------------------------------------------------
# release (skema-ci component job, extended)
# --------------------------------------------------------------------------

# The component's own `release` needs only `version`'s patched manifests; it
# also uploads this repo's binaries/wheel/wasm bundle as the generic package
# (`asset_globs` above), so it needs their artifacts too.
release:
  needs:
    - job: version
      artifacts: true
    - job: build
      artifacts: true
    - job: build-release-binaries
      artifacts: true
    - job: build-python-wheel
      artifacts: true
    - job: build-wasm-package
      artifacts: true

# --------------------------------------------------------------------------
# package
# --------------------------------------------------------------------------

# Runtime-only image build (Dockerfile just copies the binaries built above),
# so this doesn't need devenv/Rust at all. Tagged from `release`'s
# RELEASE_TAG rather than a CI tag - there are no tag pipelines any more.
docker-build:
  stage: package
  image:
    name: gcr.io/kaniko-project/executor:v1.23.2-debug
    entrypoint: [""]
  before_script: []
  needs:
    - job: build
      artifacts: true
    - job: release
      artifacts: true
  rules:
    - if: '$CI_COMMIT_BRANCH == "main" || $CI_COMMIT_BRANCH == "development"'
  script:
    - '[ -n "$RELEASE_VERSION" ] || { echo "docker-build: nothing released, skipping."; exit 0; }'
    - mkdir -p /kaniko/.docker
    - printf '{"auths":{"%s":{"auth":"%s"}}}' "$CI_REGISTRY" "$(printf '%s:%s' "$CI_REGISTRY_USER" "$CI_REGISTRY_PASSWORD" | base64 | tr -d '\n')" > /kaniko/.docker/config.json
    - |
      IMAGE_TAG="${RELEASE_TAG#v}"
      DESTINATIONS="--destination ${CI_REGISTRY_IMAGE}:${IMAGE_TAG}"
      case "$IMAGE_TAG" in
        *-rc.*) ;;
        *) DESTINATIONS="$DESTINATIONS --destination ${CI_REGISTRY_IMAGE}:latest" ;;
      esac
      /kaniko/executor \
        --context "dir://${CI_PROJECT_DIR}" \
        --dockerfile "${CI_PROJECT_DIR}/Dockerfile" \
        $DESTINATIONS

# The Cargo registry job that used to live here is gone, not disabled - a job
# that always fails teaches the team to ignore red pipelines. Why it can't
# work on GitLab.com yet, and how to bring it back: brain/decisions.md,
# "Cargo registry publish (rejected, keep off)".

# --------------------------------------------------------------------------
# pages (main, finals only)
# --------------------------------------------------------------------------

pages:
  stage: pages
  cache: *rust_cache
  needs:
    - job: version
      artifacts: true
    - job: release
      artifacts: true
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'
  script:
    - '[ -n "$RELEASE_VERSION" ] || { echo "pages: nothing released, skipping."; exit 0; }'
    - devenv shell -- mdbook build docs
    - devenv shell -- cargo doc --workspace --no-deps --exclude skema-py
    - mkdir -p public
    - cp -r docs/book/* public/
    - mkdir -p public/api
    - cp -r target/doc/* public/api/
    - |
      cat > public/api/index.html <<'EOF'
      <!doctype html><meta charset="utf-8">
      <title>skema — API reference</title>
      <h1>skema — API reference</h1>
      <ul>
        <li><a href="skema_syntax/index.html">skema-syntax</a></li>
        <li><a href="skema_hir/index.html">skema-hir</a></li>
        <li><a href="skema_loader/index.html">skema-loader</a></li>
        <li><a href="skema/index.html">skema-cli (binary target is named "skema")</a></li>
        <li><a href="skema_lsp/index.html">skema-lsp</a></li>
        <li><a href="skema_wasm/index.html">skema-wasm</a></li>
      </ul>
      EOF
  artifacts:
    paths:
      - public
