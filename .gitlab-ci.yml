## skema — GitLab CI/CD
##
## Every job runs through the project's own devenv.nix instead of a
## hand-rolled image + apt-get/rustup/pip setup. That's the single source of
## truth for the toolchain (Rust via rust-overlay, Python, maturin, mdbook,
## cargo-llvm-cov, cargo-audit — see devenv.nix) shared with local
## development: `devenv test` in CI is the exact same command contributors
## run locally as `check`.
##
## Pipeline sources: merge requests, the default branch, and tags.
## - MRs / default branch : devenv test (fmt+clippy+test), audit, coverage,
##                           build (fast feedback loop)
## - default branch only   : (re-)publish the documentation to GitLab Pages,
##                           then work out the next version and push its tag
## - tags (vX.Y.Z)         : additionally publish binaries + the Python wheel
##                           to the Package Registry, publish the library
##                           crates to the Cargo registry, push a container
##                           image, and trigger the editor and VSCode repos
##
## The release is therefore a chain, not a button: a green default branch
## tags itself (`release`), the tag builds and publishes everything, and the
## two downstream repos are handed that tag so a single merge ends with a new
## version of all three projects. Pushing a tag by hand does exactly the same
## thing from the second step on — the automation adds a trigger, not a
## parallel release path.
##
## Prerequisites in the GitLab project settings:
##   - Container Registry enabled (for the `docker-build` job)
##   - Settings → CI/CD → Job token permissions → **Allow Git push requests to
##     the repository**. Off by default; GA in GitLab 18.4 and available on
##     every tier. This is what lets `release` push the bump and the tag with
##     nothing but `CI_JOB_TOKEN` — no personal or project access token.
##   - A `RELEASE_TRIGGER_TOKEN` CI variable, masked and protected: a pipeline
##     trigger token (Settings → CI/CD → Pipeline trigger tokens).
##     A job-token push deliberately starts no pipeline — that is what keeps
##     `release` from re-triggering itself — so the tag pipeline, the one that
##     actually publishes, has to be asked for explicitly. A trigger token can
##     do nothing except start a pipeline, which makes it a far smaller thing
##     to leak than a token carrying write access to the repository.
##   - The two downstream projects must allow this one to trigger them:
##     Settings → CI/CD → Job token permissions → add `skema-language/skema`
##     to their allowlist. Without it the `trigger-*` jobs get a 404.
##     (Multi-project triggering itself is Free — it moved out of Premium in
##     12.8. Only the *pipeline graph* that visualises it is Premium, which
##     costs nothing here.)

workflow:
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_TAG
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH

stages:
  - check
  - build
  - package
  - pages
  # Both of these are the tail of a release, but they never run in the same
  # pipeline: `release` belongs to a default-branch run and produces the tag,
  # `downstream` belongs to the tag run that the tag then starts.
  - release
  - downstream

variables:
  CARGO_HOME: ${CI_PROJECT_DIR}/.cargo-home
  NIX_CONFIG: |
    experimental-features = nix-command flakes
    sandbox = false

# The classic Nix installer's single-user mode refuses to run as root
# ("installing Nix as root is not supported by this script"), which is
# exactly what every GitLab CI job container does. The Determinate Systems
# installer's `--init none` mode is built for precisely this case (root, no
# systemd) and still sets up a working nix-daemon without one. Verified
# end-to-end in a plain, unprivileged `debian:bookworm-slim` container.
# `sandbox = false` (set via NIX_CONFIG above) because Nix's build sandbox
# needs user namespaces that an unprivileged Docker-executor container
# usually can't create — moot here in practice since every package used in
# this project resolves from a binary cache instead of building from source,
# but set defensively in case that ever changes.
#
# This reruns on every job (fresh container each time), fetching the
# toolchain from cache.nixos.org / devenv.cachix.org / static.rust-lang.org
# rather than compiling from source, so it's a download, not a build. If
# pipeline latency becomes a problem, the next step is a custom runner image
# with Nix preinstalled and a persistent /nix.
#
# devenv itself is installed from the revision this project already pins,
# read out of devenv.lock. `nix profile install nixpkgs#devenv` — what this
# used to be — resolves through the flake registry to whatever nixpkgs-
# unstable happens to ship that day, which quietly made CI the one part of
# the setup that was not pinned, in a project whose entire premise is that
# devenv.lock pins the toolchain for everyone. A devenv release that changes
# how `devenv test` behaves would land in CI unannounced and turn the
# pipeline red against an unchanged commit. Deriving the revision from the
# lock instead of hardcoding it keeps `devenv update` in charge of both.
#
# The revision to read is the lock's **`devenv`** node — the same tree the
# `devenv.nix` modules are evaluated from. Reading `nodes.nixpkgs` instead
# looks equivalent and is not: that pins the package *set*, and CI then
# gets whichever devenv release that nixpkgs snapshot happens to package,
# which is a different program from the one the lock's modules belong to.
# That skew is exactly what this block exists to prevent.
.devenv_setup: &devenv_setup
  - apt-get update -qq
  - apt-get install -y --no-install-recommends curl xz-utils ca-certificates git >/dev/null
  - curl --proto '=https' --tlsv1.2 -sSf -L https://install.determinate.systems/nix -o /tmp/install-nix.sh
  - sh /tmp/install-nix.sh install linux --init none --no-confirm
  - . /nix/var/nix/profiles/default/etc/profile.d/nix-daemon.sh
  - |
    DEVENV_PIN=$(nix eval --impure --raw --expr \
      'let n = (builtins.fromJSON (builtins.readFile ./devenv.lock)).nodes.devenv.locked;
       in "${n.owner}/${n.repo}/${n.rev}"')
    echo "devenv from github:$DEVENV_PIN"
    # `--accept-flake-config` for devenv's own binary cache; without it this
    # compiles the whole Rust CLI from source on every job.
    nix profile install --accept-flake-config "github:$DEVENV_PIN"
    devenv version

.rust_cache: &rust_cache
  - key:
      files:
        - Cargo.lock
    paths:
      - .cargo-home/registry/index
      - .cargo-home/registry/cache
  - key: "target-$CI_JOB_NAME"
    paths:
      - target/

default:
  image: debian:bookworm-slim
  before_script: *devenv_setup

# --------------------------------------------------------------------------
# check
# --------------------------------------------------------------------------

# fmt + clippy (-D warnings) + test --workspace, defined once in devenv.nix
# (`enterTest`) and reused here verbatim.
check:
  stage: check
  cache: *rust_cache
  script:
    - devenv test

# The bump logic, checked before it can mis-tag anything. This is the only
# job here that runs on plain git rather than devenv: scripts/release.sh is
# deliberately toolchain-free, and so is its test.
#
# Worth a job of its own because nothing else would catch it. A wrong version
# is not a build failure — it is a wrong tag pushed to three repositories and
# a package registry, and taking that back costs far more than the minute
# this takes.
release-test:
  stage: check
  image: debian:bookworm-slim
  needs: []
  before_script:
    - apt-get update -qq
    - apt-get install -y --no-install-recommends git ca-certificates >/dev/null
  variables:
    # The suite clones this checkout and tags the clone; a shallow one has no
    # history to derive a bump from.
    GIT_DEPTH: 0
    GIT_STRATEGY: clone
  script:
    - scripts/release-test.sh

# Advisory only: dependency vulnerabilities shouldn't block every push, but
# should be visible. Flip `allow_failure` to false once the crate graph has
# been swept once and the team wants this to gate merges.
audit:
  stage: check
  allow_failure: true
  script:
    - devenv shell -- cargo audit

coverage:
  stage: check
  cache: *rust_cache
  script:
    - devenv shell -- cargo llvm-cov --workspace --cobertura --output-path cobertura.xml
    - devenv shell -- cargo llvm-cov report --summary-only
  coverage: '/^TOTAL.*\s(\d+\.\d+)%/'
  artifacts:
    reports:
      coverage_report:
        coverage_format: cobertura
        path: cobertura.xml

# --------------------------------------------------------------------------
# build
# --------------------------------------------------------------------------

# skema-py is excluded on purpose: it's not a standalone binary, and its
# proper build path (correct ABI tag, wheel packaging) is maturin, handled by
# build-python-wheel below.
build:
  stage: build
  cache: *rust_cache
  script:
    - devenv shell -- cargo build --release --workspace --exclude skema-py
  artifacts:
    paths:
      - target/release/skema
      - target/release/skema-lsp
    expire_in: 1 week

# The language server, per platform, for the VSCode extension to bundle.
#
# Cross-compiled from the same Linux runner as everything else, with the
# targets and cross linkers pinned in devenv.nix's `cross` profile — the one
# job here that passes `--profile cross`, because it is the only one that
# cross-compiles. Every other devenv job builds for the host and would
# otherwise pay for two foreign stdenvs it never invokes:
#
#   * **linux** is built against **musl and linked statically**, so one
#     binary runs on every distribution regardless of its glibc. A
#     glibc-linked binary built here would refuse to start on anything older
#     than this runner's Debian.
#   * **windows** uses the **GNU** ABI, because that is what cross-compiles
#     from Linux. An MSVC build would need a Windows runner and buys nothing.
#
# **macOS is missing, and cannot be added from here**: cross-compiling for
# Darwin needs the Apple SDK, which is not redistributable. It needs a macOS
# runner (GitLab's SaaS macOS runners, or a self-hosted one), and until there
# is one, macOS users of the extension run a `cargo install`ed server via
# `skema.serverPath` - the extension is built for exactly that fallback.
build-release-binaries:
  stage: build
  cache: *rust_cache
  rules:
    - if: $CI_COMMIT_TAG
  parallel:
    matrix:
      - TARGET:
          - x86_64-unknown-linux-musl
          - x86_64-pc-windows-gnu
  script:
    - devenv --profile cross shell -- cargo build --release -p skema-lsp --target "$TARGET"
    - mkdir -p dist
    # Named by target triple: the extension's fetch script asks for exactly
    # this name, and one unqualified `skema-lsp` per tag could only ever be
    # one platform's.
    - |
      if [ "$TARGET" = "x86_64-pc-windows-gnu" ]; then
        cp "target/$TARGET/release/skema-lsp.exe" "dist/skema-lsp-$TARGET.exe"
      else
        cp "target/$TARGET/release/skema-lsp" "dist/skema-lsp-$TARGET"
      fi
  artifacts:
    paths:
      - dist/skema-lsp-*
    expire_in: 1 week

build-python-wheel:
  stage: build
  cache: *rust_cache
  script:
    - devenv shell -- maturin build --release --manifest-path crates/skema-py/Cargo.toml --out dist
    - devenv shell -- python3 -m venv .venv
    - |
      . .venv/bin/activate
      pip install dist/*.whl
      python3 - <<'PYEOF'
      import json
      import skema
      print(json.dumps(skema.check("examples/myexample.skema"))[:200])
      PYEOF
  artifacts:
    paths:
      - dist/*.whl
    expire_in: 1 week

# The browser build: wasm-bindgen's raw output, tarred up as a build
# artifact. Nothing here turns it into the `@skema/model`/`@skema/wasm` npm
# packages — that is JS by nature and belongs in skema-lib
# (`wasm-packaging/`, brain/tasks/10), not in this Rust-only repo. This job's
# only job is producing the one generated `.d.ts` (plus the runtime files
# beside it) that both packages are each a half of, for skema-lib's
# `fetch-artifact.mjs` to download from this tag's generic package registry
# entry — see `publish-generic-package` below.
#
# The tarball is also the old delivery route — skemaeditor used to vendor
# those four files into `src/wasm/generated/` and commit them. It is kept
# until that repo has moved to the `@skema/wasm` dependency, so a release can
# still be rolled back to the vendoring path.
build-wasm-package:
  stage: build
  cache: *rust_cache
  rules:
    - if: $CI_COMMIT_TAG
  script:
    - devenv shell -- bash -c "cd crates/skema-wasm && wasm-pack build --target web --release"
    - mkdir -p dist
    - |
      tar czf dist/skema-wasm.tar.gz -C crates/skema-wasm/pkg \
        skema_wasm.js skema_wasm.d.ts skema_wasm_bg.wasm skema_wasm_bg.wasm.d.ts
  artifacts:
    paths:
      - dist/skema-wasm.tar.gz
    expire_in: 1 week

# --------------------------------------------------------------------------
# package (tags only)
# --------------------------------------------------------------------------

# Runtime-only image build (Dockerfile just copies the binaries built above),
# so this doesn't need devenv/Rust at all.
docker-build:
  stage: package
  image:
    name: gcr.io/kaniko-project/executor:v1.23.2-debug
    entrypoint: [""]
  before_script: []
  needs:
    - job: build
      artifacts: true
  rules:
    - if: $CI_COMMIT_TAG
  script:
    - mkdir -p /kaniko/.docker
    - printf '{"auths":{"%s":{"auth":"%s"}}}' "$CI_REGISTRY" "$(printf '%s:%s' "$CI_REGISTRY_USER" "$CI_REGISTRY_PASSWORD" | base64 | tr -d '\n')" > /kaniko/.docker/config.json
    - /kaniko/executor
      --context "dir://${CI_PROJECT_DIR}"
      --dockerfile "${CI_PROJECT_DIR}/Dockerfile"
      --destination "${CI_REGISTRY_IMAGE}:${CI_COMMIT_TAG}"
      --destination "${CI_REGISTRY_IMAGE}:latest"

# Just uploads pre-built artifacts, no Rust/devenv needed.
publish-generic-package:
  stage: package
  image: curlimages/curl:latest
  before_script: []
  needs:
    - job: build
      artifacts: true
    - job: build-release-binaries
      artifacts: true
    - job: build-python-wheel
      artifacts: true
    - job: build-wasm-package
      artifacts: true
  rules:
    - if: $CI_COMMIT_TAG
  script:
    # `target/release/*` are this runner's own (glibc) build, kept as the
    # plain `skema`/`skema-lsp` names they have always had. The
    # `dist/skema-lsp-<triple>` ones are what the VSCode extension fetches,
    # and `dist/skema-wasm.tar.gz` is what skemaeditor vendors.
    - |
      for f in target/release/skema target/release/skema-lsp dist/skema-lsp-* dist/*.whl dist/skema-wasm.tar.gz; do
        [ -e "$f" ] || continue
        name=$(basename "$f")
        curl --fail --header "JOB-TOKEN: ${CI_JOB_TOKEN}" --upload-file "$f" \
          "${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/packages/generic/skema/${CI_COMMIT_TAG}/${name}"
      done

# The Cargo registry job that used to live here is gone, not disabled: on
# GitLab.com it cannot work yet, and a job that always fails teaches the team
# to ignore red pipelines.
#
# It failed with `failed to update registry 'gitlab': config.json not found`.
# Three separate things were wrong, and only the first is a typo:
#
#   1. The index URL ended in `/packages/cargo/config.json/`. A sparse index
#      is a *base* URL — cargo appends `config.json` itself, so it was asking
#      for `.../cargo/config.json/config.json`. The base is `/packages/cargo/`.
#   2. GitLab has not shipped the Cargo registry. The feature flag is not
#      rolled out on GitLab.com and the end-to-end `cargo publish` flow is
#      still unchecked on the tracking issue (gitlab-org/gitlab#33060).
#      `/packages/cargo/config.json` 404s on this project while the pypi and
#      npm endpoints next to it answer fine. Nothing to do with the tier.
#   3. Even once it ships, publishing would still fail: with `version` but no
#      `registry`, cargo records the internal path dependencies as *crates.io*
#      dependencies. `cargo package -p skema-hir` says so —
#      "no matching package named `skema-syntax` found, location searched:
#      crates.io index" — and it says it even with `--registry gitlab`. The
#      workspace dependencies in Cargo.toml would each need
#      `registry = "gitlab"` added, which then makes every consumer of the
#      crates configure that registry to build at all.
#
# The library crates are not lost in the meantime: `publish-generic-package`
# above uploads the binaries and the wheel, and the two downstream repos
# consume this project through those artifacts, not through a crate index.
# Nothing in the release chain depends on the Cargo registry.
#
# To bring it back once GitLab enables the feature: restore the job with
# `index = "sparse+${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/packages/cargo/"`,
# add `registry = "gitlab"` to the four workspace dependencies, and publish in
# dependency order (skema-syntax, skema-hir, skema-loader) with --no-verify.

# --------------------------------------------------------------------------
# pages (default branch only)
# --------------------------------------------------------------------------

pages:
  stage: pages
  cache: *rust_cache
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
  script:
    - devenv shell -- mdbook build docs
    - devenv shell -- cargo doc --workspace --no-deps --exclude skema-py
    - mkdir -p public
    - cp -r docs/book/* public/
    - mkdir -p public/api
    - cp -r target/doc/* public/api/
    - |
      cat > public/api/index.html <<'EOF'
      <!doctype html><meta charset="utf-8">
      <title>skema — API reference</title>
      <h1>skema — API reference</h1>
      <ul>
        <li><a href="skema_syntax/index.html">skema-syntax</a></li>
        <li><a href="skema_hir/index.html">skema-hir</a></li>
        <li><a href="skema_loader/index.html">skema-loader</a></li>
        <li><a href="skema/index.html">skema-cli (binary target is named "skema")</a></li>
        <li><a href="skema_lsp/index.html">skema-lsp</a></li>
        <li><a href="skema_wasm/index.html">skema-wasm</a></li>
      </ul>
      EOF
  artifacts:
    paths:
      - public

# --------------------------------------------------------------------------
# release (default branch only)
# --------------------------------------------------------------------------

# Works out the next version from the commits since the last tag, writes it
# into Cargo.toml/Cargo.lock, and pushes the tag. That tag starts the pipeline
# that actually publishes, so this job deliberately builds nothing itself.
#
# No devenv here: scripts/release.sh edits the two manifests with sed and awk
# precisely so this stays a git-only job, instead of installing Nix and a Rust
# toolchain to change eight version lines.
release:
  stage: release
  image: debian:bookworm-slim
  before_script:
    - apt-get update -qq
    - apt-get install -y --no-install-recommends git curl ca-certificates >/dev/null
  variables:
    # The bump is derived from `git log <last tag>..HEAD`, and the default
    # shallow clone has neither the tags nor the history to derive it from.
    GIT_DEPTH: 0
    GIT_STRATEGY: clone
  rules:
    # The one rule that keeps this from feeding itself: the job pushes a
    # commit to the branch it watches. Matching its own message is what breaks
    # the loop. `[skip ci]` would be the usual trick and is wrong here — the
    # tag points at that same commit, so GitLab would skip the tag pipeline as
    # well, which is the one that publishes.
    - if: $CI_COMMIT_MESSAGE =~ /^chore\(release\):/
      when: never
    # Never off a downstream trigger, only off a real push to the branch.
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH && $CI_PIPELINE_SOURCE == "push"
  script:
    - scripts/release.sh

# --------------------------------------------------------------------------
# downstream (tags only)
# --------------------------------------------------------------------------

# Hands the freshly published tag to the two repos that consume it. Both are
# `strategy: depend`, so this pipeline stays red if theirs goes red — a
# release that only half-shipped should not look green here.
#
# Note what is *not* here: neither project is rebuilt against an unreleased
# language. They each fetch a published artifact of this exact tag — the
# `skema-lsp` binaries for the extension, the WASM bundle for the editor —
# which is why these jobs sit in a stage after `package` rather than beside
# it. Triggering before the upload finished would send them shopping for
# something that is not on the shelf yet.
.trigger: &trigger
  stage: downstream
  rules:
    - if: $CI_COMMIT_TAG
  variables:
    SKEMA_RELEASE: $CI_COMMIT_TAG

trigger-vscode:
  <<: *trigger
  trigger:
    project: skema-language/skema-vscode
    branch: main
    strategy: depend

trigger-editor:
  <<: *trigger
  trigger:
    project: skema-language/skema-editor
    branch: main
    strategy: depend
